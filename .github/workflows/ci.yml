name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore UrlShortener.sln

      - name: Build Solution
        run: dotnet build UrlShortener.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test UrlShortener.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
